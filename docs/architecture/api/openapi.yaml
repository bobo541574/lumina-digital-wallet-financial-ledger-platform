      responses:
        '200':
          description: Outcome recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { status: { type: string } } }
        '202': { description: WEBHOOK_QUARANTINED (unknown reference) or unrecognized status. }
        '400': { description: WEBHOOK_SIGNATURE_INVALID. }
        '503': { description: PROVIDER_UNAVAILABLE. }
