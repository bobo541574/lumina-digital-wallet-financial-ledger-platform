  /payment-providers/{provider}/webhook:
    post:
      tags: [PaymentProviders]
      summary: Provider deposit/webhook callback (collect)
      description: Public route authenticated by provider signature header. Verifies signature, deduplicates on (provider, event_id), verifies amount/currency/reference before posting.
      operationId: providerWebhook
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [fake, kbzpay, wavemoney, aya, '2c2p'] } }
        - { name: X-Signature, in: header, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Processed. Duplicate event is acknowledged (no re-post).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [succeeded, failed, processing, duplicate] }
                      deposit_id: { type: string, format: uuid }
                  error: { $ref: '#/components/schemas/ErrorEnvelope' }
        '202': { description: 'WEBHOOK_QUARANTINED (no matching deposit, or amount/currency mismatch).' }
        '400': { description: WEBHOOK_SIGNATURE_INVALID. }
        '503': { description: PROVIDER_UNAVAILABLE. }
  /payment-providers/{provider}/payout-webhook:
    post:
      tags: [PaymentProviders]
      summary: Provider payout callback
      description: Signature-verified payout outcome. Confirms payout (posts ledger, consumes hold) or verified failure (releases hold).
      operationId: providerPayoutWebhook
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [fake, kbzpay, wavemoney, aya, '2c2p'] } }
        - { name: X-Signature, in: header, required: true, schema: { type: string } }
