openapi: 3.1.0
info:
  title: Lumina Digital Wallet & Financial Ledger API
  version: 1.0.0
  description: >
    API-first contract for the Lumina digital wallet platform. All monetary amounts are
    integers in currency minor units (see currencies.minor_units). Funds move only after
    backend verification: idempotency keys on mutations, ownership checks on every request,
    signature-verified provider webhooks. Error codes and envelopes are documented in
    error-codes and enforced by the API.
  license:
    name: Proprietary
servers:
  - url: https://{host}/{basePath}
    variables:
      host:
        default: api.lumina.example
      basePath:
        default: api/v1
tags:
  - name: Auth
    description: Registration, login, session and two-factor authentication.
  - name: Wallets
    description: Customer wallets, balances, transactions, statements.
  - name: Transfers
    description: Internal wallet-to-wallet transfers.
  - name: Deposits
    description: Manual and provider deposits.
  - name: Withdrawals
    description: Withdrawals with holds and payout lifecycle.
  - name: PaymentProviders
    description: Provider webhooks (signature-authenticated).
  - name: Admin
    description: Admin/finance search, review, ledger, reconciliation and audit. Requires admin two-factor when enabled.
  - name: Notifications
    description: In-app notifications for the authenticated user.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
  headers:
    XRequestId:
      description: Correlation id. Echoed from the request, or generated (ULID) if absent.
      schema: { type: string }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 8-255 char client key; scoped to (actor, operation). Replay returns the stored result; reuse with a different payload returns IDEMPOTENCY_KEY_REUSED.
      schema: { type: string, minLength: 8, maxLength: 255 }
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client correlation id (ULID preferred).
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor token from the previous page (Laravel cursor pagination).
      schema: { type: string }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    From:
      name: from
      in: query
      required: false
      description: ISO-8601 date (start of period).
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      required: false
      description: ISO-8601 date (end of period); must be >= from.
      schema: { type: string, format: date }
  schemas:
    RequestId:
      type: object
      properties:
        request_id: { type: string, example: 01JABCDEFGHJKMNPQRSTVWXY }
      required: [request_id]
    Meta:
      type: object
      properties:
        request_id: { type: string }
        pagination:
          type: object
          properties:
            per_page: { type: integer }
            next_cursor: { type: [string, 'null'] }
            prev_cursor: { type: [string, 'null'] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: [string, 'null'] }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        two_factor_enabled: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
    TokenResponse:
      type: object
      required: [user, token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string, description: Sanctum plain-text token (shown once). }
    WalletBalance:
      type: object
      properties:
        wallet_id: { type: string, format: uuid }
        currency: { type: string, minLength: 3, maxLength: 3 }
        minor_units: { type: integer, description: Decimal places; amounts are integers in these minor units. }
        posted_balance: { type: integer }
        reserved_balance: { type: integer }
        available_balance: { type: integer }
    Wallet:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status: { type: string, enum: [active, frozen, closed] }
        balance: { $ref: '#/components/schemas/WalletBalance' }
        created_at: { type: [string, 'null'], format: date-time }
    WalletTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        journal_entry_id: { type: string, format: uuid }
        entry_type: { type: string, enum: [transfer, deposit, withdrawal, fee, reversal, adjustment] }
        source_type: { type: string }
        source_id: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        direction: { type: string, enum: [debit, credit] }
        amount: { type: integer }
        signed_amount: { type: integer }
        currency: { type: string, minLength: 3, maxLength: 3 }
        occurred_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
    Statement:
      type: object
      properties:
        currency: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        opening_balance: { type: integer }
        closing_balance: { type: integer }
        movements: { type: array, items: { $ref: '#/components/schemas/WalletTransaction' } }
    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        sender_wallet_id: { type: string, format: uuid }
        recipient_wallet_id: { type: string, format: uuid }
        currency: { type: string, minLength: 3, maxLength: 3 }
        amount: { type: integer }
        fee: { type: integer }
        journal_entry_id: { type: [string, 'null'], format: uuid }
        failure_code: { type: [string, 'null'] }
        occurred_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
    Deposit:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status:
          type: string
          enum: [pending, awaiting_approval, approved, awaiting_payment, processing, reconciling, succeeded, failed, cancelled]
        channel: { type: string, enum: [manual, provider] }
        wallet_id: { type: string, format: uuid }
        currency: { type: string, minLength: 3, maxLength: 3 }
        amount: { type: integer }
        provider: { type: [string, 'null'] }
        provider_reference: { type: [string, 'null'] }
        provider_transaction_id: { type: [string, 'null'] }
        payment_url: { type: [string, 'null'] }
        qr_code: { type: [string, 'null'] }
        journal_entry_id: { type: [string, 'null'], format: uuid }
        failure_code: { type: [string, 'null'] }
        approved_at: { type: [string, 'null'], format: date-time }
        settled_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
    Withdrawal:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status:
          type: string
          enum: [pending, reserved, processing, reconciling, succeeded, failed, cancelled]
        wallet_id: { type: string, format: uuid }
        currency: { type: string, minLength: 3, maxLength: 3 }
        amount: { type: integer }
        fee: { type: integer }
        hold_id: { type: [string, 'null'], format: uuid }
        provider: { type: [string, 'null'] }
        provider_reference: { type: [string, 'null'] }
        journal_entry_id: { type: [string, 'null'], format: uuid }
        failure_code: { type: [string, 'null'] }
        initiated_at: { type: [string, 'null'], format: date-time }
        settled_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
    Posting:
      type: object
      properties:
        id: { type: string, format: uuid }
        ledger_account_id: { type: string, format: uuid }
        wallet_id: { type: [string, 'null'], format: uuid }
        direction: { type: string, enum: [debit, credit] }
        amount: { type: integer }
    JournalEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        entry_type: { type: string, enum: [transfer, deposit, withdrawal, fee, reversal, adjustment] }
        status: { type: string, enum: [posted, reversed] }
        source_type: { type: [string, 'null'] }
        source_id: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        occurred_at: { type: [string, 'null'], format: date-time }
        postings: { type: array, items: { $ref: '#/components/schemas/Posting' } }
        reverses_journal_entry_id: { type: [string, 'null'], format: uuid }
    ReconciliationRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        layer: { type: string, enum: [wallet, provider, settlement] }
        status: { type: string, enum: [running, completed, completed_with_discrepancies, failed] }
        scope: { type: [object, 'null'], additionalProperties: true }
        summary: { type: [object, 'null'], additionalProperties: true }
        items_count: { type: integer }
        discrepancies_count: { type: integer }
        error: { type: [string, 'null'] }
        initiated_by: { type: [string, 'null'], format: uuid }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/ReconciliationItem' } }
    ReconciliationItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        layer: { type: string, enum: [wallet, provider, settlement] }
        classification: { type: string, enum: [missing, duplicate, amount_mismatch, status_mismatch, timing] }
        status: { type: string, enum: [open, resolved, ignored] }
        subject_type: { type: string }
        subject_id: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        currency: { type: [string, 'null'] }
        difference: { type: integer }
        expected: { type: [object, 'null'], additionalProperties: true }
        actual: { type: [object, 'null'], additionalProperties: true }
        resolution: { type: [object, 'null'], additionalProperties: true }
        resolution_note: { type: [string, 'null'] }
        resolved_by: { type: [string, 'null'], format: uuid }
        resolved_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_type: { type: [string, 'null'] }
        actor_id: { type: [string, 'null'] }
        action: { type: string }
        subject_type: { type: [string, 'null'] }
        subject_id: { type: [string, 'null'] }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        correlation_id: { type: [string, 'null'] }
        ip_address: { type: [string, 'null'] }
        occurred_at: { type: [string, 'null'], format: date-time }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        label: { type: string }
        is_system: { type: boolean }
        permissions: { type: array, items: { type: string } }
        users_count: { type: integer }
    Permission:
      type: object
      properties:
        name: { type: string }
        label: { type: string }
    UserNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: [string, 'null'] }
        data: { type: [object, 'null'], additionalProperties: true }
        read: { type: boolean }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
  responses:
    Unauthenticated:
      description: Missing/invalid bearer token (401).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: UNAUTHENTICATED, message: Unauthenticated., details: {}, request_id: 01JABCDEFGHJKMNPQRSTVWXY }
    Forbidden:
      description: Authenticated but not authorized (403).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found, or hidden for authorization (404).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Validation failed or business rule violated (422).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: VALIDATION_FAILED
              message: The given data was invalid.
              details: { fields: { email: [The email field must be a valid email address.] } }
              request_id: 01JABCDEFGHJKMNPQRSTVWXY
    RateLimited:
      description: Rate limited (429) with Retry-After header.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer
      operationId: register
      parameters: [{ $ref: '#/components/parameters/XRequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string }
                device_name: { type: string, maxLength: 255, default: api }
      responses:
        '201':
          description: Registered. Customer role assigned; bearer token returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenResponse' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      operationId: login
      parameters: [{ $ref: '#/components/parameters/XRequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string, maxLength: 255, default: api }
                two_factor_code: { type: string, description: Required when the account has 2FA enabled. }
      responses:
        '200':
          description: Logged in; bearer token returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenResponse' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          description: Bad credentials, MFA_REQUIRED or TWO_FACTOR_INVALID_CODE.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile and permissions
      operationId: me
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/XRequestId' }]
      responses:
        '200':
          description: The authenticated user with effective roles and permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (revoke current token)
      operationId: logout
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/XRequestId' }]
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { message: { type: string } } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/two-factor/enable:
    post:
      tags: [Auth]
      summary: Enable two-factor authentication
      operationId: twoFactorEnable
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/XRequestId' }]
      responses:
        '200':
          description: Pending TOTP secret issued; confirm with /confirm.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret: { type: string }
                      otpauth_uri: { type: string }
                  meta: { $ref: '#/components/schemas/Meta' }
        '409': { description: TWO_FACTOR_ALREADY_ENABLED. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/two-factor/confirm:
    post:
      tags: [Auth]
      summary: Confirm 2FA with a TOTP code
      operationId: twoFactorConfirm
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/XRequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Enabled; recovery codes shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recovery_codes: { type: array, items: { type: string } }
                      message: { type: string }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: TWO_FACTOR_INVALID_CODE. }
        '409': { description: TWO_FACTOR_NOT_ENABLED or TWO_FACTOR_ALREADY_ENABLED. }
  /auth/two-factor/disable:
    post:
      tags: [Auth]
      summary: Disable two-factor authentication
      operationId: twoFactorDisable
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/XRequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { message: { type: string } } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: TWO_FACTOR_INVALID_CODE. }
        '409': { description: TWO_FACTOR_NOT_ENABLED. }
  /auth/two-factor/recovery-codes:
    post:
      tags: [Auth]
      summary: Regenerate recovery codes
      operationId: twoFactorRecoveryCodes
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/XRequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 64 }
      responses:
        '200':
          description: New codes; prior set invalidated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { recovery_codes: { type: array, items: { type: string } } } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { description: TWO_FACTOR_INVALID_CODE. }
  /wallets:
    get:
      tags: [Wallets]
      summary: List my wallets
      operationId: listWallets
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/XRequestId' }]
      responses:
        '200':
          description: Owner's wallets (unpaginated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Wallet' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Wallets]
      summary: Open a wallet
      operationId: openWallet
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/XRequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency: { type: string, minLength: 3, maxLength: 3, description: Existing currency code. }
                name: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Wallet created with cached balances.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Wallet' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '422':
          description: VALIDATION_FAILED or UNSUPPORTED_CURRENCY.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /wallets/{wallet}/balance:
    get:
      tags: [Wallets]
      summary: Wallet balance
      operationId: walletBalance
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - { name: wallet, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: posted/reserved/available balance in minor units.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WalletBalance' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /wallets/{wallet}/transactions:
    get:
      tags: [Wallets]
      summary: Wallet transaction history
      operationId: walletTransactions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - { name: wallet, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - { name: type, in: query, required: false, schema: { type: string, enum: [transfer, deposit, withdrawal, fee, reversal, adjustment] } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Cursor-paginated ledger-derived movements.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/WalletTransaction' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /wallets/{wallet}/statement:
    get:
      tags: [Wallets]
      summary: Wallet statement (opening, movements, closing)
      operationId: walletStatement
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - { name: wallet, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Statement with running movements; totals match the ledger.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Statement' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
